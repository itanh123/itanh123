<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5" />
    </linearGradient>

    <!-- Accent Gradient for Text -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45" result="blur" />
    </filter>

    <!-- Modern Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
      <circle cx="30" cy="30" r="0.75" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; font-size: 34px; letter-spacing: -0.5px; }
    .subtitle { font-weight: 500; font-size: 15px; fill: #94a3b8; }
    .tag { font-size: 11px; font-weight: 600; }
    .badge-text { font-size: 12px; font-weight: 500; fill: #cbd5e1; }
  </style>

  <!-- Card Frame -->
  <rect x="2" y="2" width="896" height="256" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  
  <!-- Subtle Background Grid -->
  <rect x="2" y="2" width="896" height="256" rx="14" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="80" r="90" fill="#0284c7" fill-opacity="0.15" filter="url(#glowCyan)" />
  <circle cx="800" cy="180" r="110" fill="#7c3aed" fill-opacity="0.18" filter="url(#glowPurple)" />

  <!-- Top Terminal Bar -->
  <g transform="translate(30, 24)">
    <circle cx="6" cy="6" r="4.5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="22" cy="6" r="4.5" fill="#eab308" fill-opacity="0.8" />
    <circle cx="38" cy="6" r="4.5" fill="#22c55e" fill-opacity="0.8" />
    <text x="60" y="10" class="mono" font-size="12" fill="#64748b">itanh123 ~ portfolio.config.json</text>
    
    <!-- Status Pill Right -->
    <g transform="translate(640, -4)">
      <rect x="0" y="0" width="198" height="22" rx="11" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="0.8" />
      <circle cx="12" cy="11" r="3.5" fill="#10b981" />
      <text x="24" y="15" class="sans" font-size="11" font-weight="600" fill="#a7f3d0">Open to Opportunities</text>
    </g>
  </g>

  <!-- Decorative Separator Line -->
  <line x1="30" y1="52" x2="870" y2="52" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />

  <!-- Main Hero Content -->
  <!-- Left Side: Identification -->
  <g transform="translate(40, 84)">
    <!-- Terminal Prompt prefix -->
    <text x="0" y="16" class="mono" font-size="14" fill="#38bdf8" font-weight="600">const developer = {</text>
    
    <!-- Name -->
    <text x="20" y="52" class="sans title" fill="url(#titleGrad)">VŨ HẢI ANH</text>
    
    <!-- Role & Tagline -->
    <text x="20" y="80" class="sans subtitle">Web Developer • PHP &amp; Laravel • Practical Problem Solver</text>
    <text x="20" y="102" class="sans subtitle" fill="#64748b" font-size="13">Crafting robust backend services &amp; modern web interfaces</text>
    
    <text x="0" y="132" class="mono" font-size="14" fill="#818cf8" font-weight="600">};</text>
  </g>

  <!-- Right Side: Focus Tech Pillars -->
  <g transform="translate(560, 96)">
    <!-- Pill 1: Backend Architecture -->
    <g transform="translate(0, 0)">
      <rect width="300" height="34" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#38bdf8" />
      <text x="32" y="21" class="mono badge-text"><tspan fill="#38bdf8" font-weight="700">Backend :</tspan> PHP 8.x, Laravel, MySQL</text>
    </g>

    <!-- Pill 2: Architecture & Patterns -->
    <g transform="translate(0, 42)">
      <rect width="300" height="34" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#818cf8" />
      <text x="32" y="21" class="mono badge-text"><tspan fill="#818cf8" font-weight="700">Design  :</tspan> MVC, REST, Clean Code</text>
    </g>

    <!-- Pill 3: Frontend & Tools -->
    <g transform="translate(0, 84)">
      <rect width="300" height="34" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#c084fc" />
      <text x="32" y="21" class="mono badge-text"><tspan fill="#c084fc" font-weight="700">Frontend:</tspan> HTML5, CSS3, Blade, JS</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M 40 244 L 860 244" stroke="url(#titleGrad)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5" />
</svg>
